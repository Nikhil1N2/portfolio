<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>media queries</title>
    <style>
        .container{
            background-color: red;
            height:50vh
        }
        @media  (max-width:900px) {
            body{
                background-color: black;
            }
            .container{
                background-color: yellow;
            }
        }
    </style>
</head>
<body>
    <div class="container">Lorem ipsum dolor sit amet consectetur adipisicing elit. Neque voluptas, eum itaque, vel doloribus, sapiente facere eligendi architecto dolorum nostrum maiores ipsam fugit debitis? Aliquid accusantium dolore nam molestiae nihil quas a id voluptas!</div>
</body>
</html>
