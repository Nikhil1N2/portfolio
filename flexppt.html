<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex properties</title>
    <style>
        .container{
            display: flex;
            /* flex-direction:row; */
            /* flex-direction:wrap; */
            background-color: aqua;
            height:100vh;
            justify-content: center;
            align-items: center;
        }
        .box1{
            background-color: blue;
            height:234px;
            width:245px;
            border:2px solid black;
            order:3;
            /* align-self: self-end; */
            /* flex-grow: 1; */
            flex-shrink: 5;
        }
        .box2{
            background-color: red;
            height:234px;
            width:245px;
            border: 2px solid black;
            /* flex-grow: 3; */
            flex-shrink: 6;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box1">box1</div>
        <div class="box2">box2</div>
        <div class="box2">box2a</div>
        <div class="box2">box2b</div>

    </div>
</body>
</html>
