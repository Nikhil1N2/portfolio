<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .progress{
            background-color: red;
            height:4px;
            animation:load 1s ease-in-out;
        }
        *{
            margin: 0;
            padding: 0;
        }
        header{
            height:122px;
            background-color: black;
        }
        main{
            height:899px;
            background-color: blue;
        }
      
        .slider{
            background-color: white;
            height:400px;
            width:100%;
            margin: auto;
            overflow: hidden;
            display:flex;
            justify-content: center;
        }
        @keyframes rotate {
            0%{
                transform:rotate(0deg);                                 
            }
            
            100%{
                transform:rotate(360deg);
            }
            
        }
        @keyframes slide1 {
            0%{
                transform:translate(-8vw);                                 
            }
            
            100%{
                transform:translate(85vw);
            }
            
        }
        @keyframes slide2 {
            0%{
                transform:translate(0vw);                                 
            }
            
            100%{
                transform:translate(92vw);
            }
            
        }
        .img1{
            transform:translate(-40vh);
            animation:slide1 1s 2s forwards;

        }
        .img2{
            transform:translate(0vh);
            animation:slide2 1s 2s forwards;


        }
        .img3{
            transform:translate(40vh);

        }
        
    </style>
</head>
<body>
    <div class="progress"></div>
    <header></header>
    <main>
     <!-- <img src="nikhil.jpeg" width="400px" alt="no image" > -->
     <div class="slider">
        <img class="img1" src="nikhil.jpeg"  alt="no image" >
        <img class="img2" src="hritk.jpeg"  alt="no image" >
        <img class="img3" src="class.jpeg" alt="no image" >

     </div>

    </main>
</body>
<script>

</script>
</html>
